name: auto_market
version: "1.0.0"
config-version: 2
profile: auto_market

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

models:
  auto_market:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: analytics
      +materialized: table

seeds:
  auto_market:
    +schema: analytics
    companies:
      +column_types:
        ticker: varchar
        company_name: varchar
        country: varchar
        segment: varchar
        currency: varchar
